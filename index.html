document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

of\" style=\"color:#6B7587;font-size:14px\">Proof<\u002Fa>\n      <a href=\"#status\" style=\"color:#6B7587;font-size:14px\">Status<\u002Fa>\n      <a href=\"devlog.html\" style=\"background:#172133;color:#F7F5ED;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600\">Dev log<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n  <div style=\"height:2px;background:transparent\"><div ref=\"{{ barRef }}\" style=\"height:2px;width:0%;background:#E89E2E\"><\u002Fdiv><\u002Fdiv>\n<\u002Fheader>\n\n<main>\n\n<div style=\"max-width:1120px;margin:0 auto;padding:clamp(56px,9vw,104px) clamp(20px,4vw,40px) clamp(20px,3vw,32px)\">\n  <span style=\"display:inline-flex;align-items:center;gap:8px;border:1px solid #E4DFD0;border-radius:999px;padding:5px 13px;font-size:12px;color:#6B7587;background:#FFF;box-shadow:0 6px 18px rgba(23,33,51,.06)\">\n    <span style=\"width:7px;height:7px;border-radius:50%;background:#E89E2E;flex:none\"><\u002Fspan>In development, iOS first\n  <\u002Fspan>\n  <h1 style=\"font-size:clamp(38px,6.4vw,64px);line-height:1.03;letter-spacing:-.03em;font-weight:700;margin:22px 0 0;max-width:17ch;text-wrap:pretty\">Trips that include the legs nothing else will route.<\u002Fh1>\n  <p style=\"font-size:clamp(17px,2vw,19px);color:#6B7587;max-width:52ch;margin:22px 0 0;text-wrap:pretty\">Shuttles with no feed. Walks through terminal interiors. The unmarked post outside door D. Laneway plans them, and every fact it gives you carries the source it came from.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:32px\">\n    <a href=\"#problem\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:650;background:#E89E2E;color:#1F1705;box-shadow:0 10px 24px rgba(232,158,46,.3)\">See the case it was built for<\u002Fa>\n    <a href=\"devlog.html\" style=\"display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:650;background:#FFF;border:1px solid #E4DFD0;color:#172133\">Read the dev log<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:34px\">\n    <span style=\"font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #E4DFD0;background:#FFF;color:#6B7587\">UP Express<\u002Fspan>\n    <span style=\"font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #E4DFD0;background:#FFF;color:#6B7587\">GO Transit<\u002Fspan>\n    <span style=\"font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #E4DFD0;background:#FFF;color:#6B7587\">TTC<\u002Fspan>\n    <span style=\"font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #E4DFD0;background:#FFF;color:#6B7587\">MiWay<\u002Fspan>\n    <span style=\"font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #E4DFD0;background:#FFF;color:#6B7587\">Calgary Transit<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div ref=\"{{ stageRef }}\" style=\"position:relative;height:360vh\">\n  <div style=\"position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n\n    <div ref=\"{{ glowRef }}\" style=\"position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(232,158,46,.26),rgba(232,158,46,0) 62%);opacity:0;pointer-events:none\"><\u002Fdiv>\n\n    <div data-cue=\"0\" style=\"position:absolute;top:clamp(56px,9vh,96px);left:0;right:0;text-align:center;padding:0 24px;opacity:0\">\n      <p style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 10px\">The plan, unpacked<\u002Fp>\n      <h2 style=\"font-size:clamp(24px,3.4vw,36px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0 auto;max-width:20ch\">Pearson T1 to an off-airport rental depot.<\u002Fh2>\n    <\u002Fdiv>\n    <div data-cue=\"1\" style=\"position:absolute;top:clamp(56px,9vh,96px);left:0;right:0;text-align:center;padding:0 24px;opacity:0\">\n      <p style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 10px\">Every side of it<\u002Fp>\n      <h2 style=\"font-size:clamp(24px,3.4vw,36px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0 auto;max-width:20ch\">Four legs, four sources, one journey.<\u002Fh2>\n    <\u002Fdiv>\n    <div data-cue=\"2\" style=\"position:absolute;top:clamp(56px,9vh,96px);left:0;right:0;text-align:center;padding:0 24px;opacity:0\">\n      <p style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 10px\">Verifying<\u002Fp>\n      <h2 style=\"font-size:clamp(24px,3.4vw,36px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0 auto;max-width:20ch\">Checked leg by leg, before you ever see it.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div data-label=\"left\" style=\"position:absolute;left:clamp(16px,6vw,90px);top:46%;width:230px;background:#FFF;border:1px solid #E4DFD0;border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px rgba(23,33,51,.1);opacity:0\">\n      <div style=\"font-size:14px;font-weight:650\">Sourced, not guessed<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6B7587;margin-top:4px\">Each leg carries the URL it came from and the moment it was fetched.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-label=\"right\" style=\"position:absolute;right:clamp(16px,6vw,90px);top:56%;width:230px;background:#FFF;border:1px solid #E4DFD0;border-radius:16px;padding:14px 16px;box-shadow:0 14px 34px rgba(23,33,51,.1);opacity:0\">\n      <div style=\"font-size:14px;font-weight:650\">Unverified stays visible<\u002Fdiv>\n      <div style=\"font-size:13px;color:#6B7587;margin-top:4px\">The shuttle with no timetable is shown as unverified, never quietly dropped.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:re x;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:12px;font-weight:650\"><span>14:02<\u002Fspan><span>5G<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:10px 20px 0\">\n                <span style=\"display:block;font-size:12px;color:#9EA8BA\">Pearson T1 to rental depot<\u002Fspan>\n                <b style=\"display:block;font-size:20px;font-weight:700;margin-top:3px\">4 legs, 38 min<\u002Fb>\n              <\u002Fdiv>\n              <div style=\"flex:1;margin:14px 12px 12px;border-radius:26px;background:#131C2C;border:1px solid #24314A;padding:14px;display:flex;flex-direction:column;gap:10px\">\n                <div data-leg=\"0\" style=\"display:flex;gap:11px;align-items:flex-start;background:#1A2436;border-radius:14px;padding:12px;opacity:.25\">\n                  <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#43BC7E;margin-top:5px\"><\u002Fspan>\n                  <span style=\"flex:1\"><b style=\"display:block;font-size:13.5px;font-weight:640\">Walk to LINK, level 3<\u002Fb><i data-legmeta=\"\" style=\"display:block;font-style:normal;font-size:11.5px;color:#9EA8BA;margin-top:2px\">6 min / checking…<\u002Fi><\u002Fspan>\n                <\u002Fdiv>\n                <div data-leg=\"1\" style=\"display:flex;gap:11px;align-items:flex-start;background:#1A2436;border-radius:14px;padding:12px;opacity:.25\">\n                  <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#43BC7E;margin-top:5px\"><\u002Fspan>\n                  <span style=\"flex:1\"><b style=\"display:block;font-size:13.5px;font-weight:640\">LINK train to Terminal 3<\u002Fb><i data-legmeta=\"\" style=\"display:block;font-style:normal;font-size:11.5px;color:#9EA8BA;margin-top:2px\">4 min / checking…<\u002Fi><\u002Fspan>\n                <\u002Fdiv>\n                <div data-leg=\"2\" style=\"display:flex;gap:11px;align-items:flex-start;background:#241F14;border:1px solid #6A5326;border-radius:14px;padding:12px;opacity:.25\">\n                  <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#E0A94A;margin-top:5px\"><\u002Fspan>\n                  <span style=\"flex:1\"><b style=\"display:block;font-size:13.5px;font-weight:640\">Operator shuttle<\u002Fb><i data-legmeta=\"\" style=\"display:block;font-style:normal;font-size:11.5px;color:#E0A94A;margin-top:2px\">Checking…<\u002Fi><\u002Fspan>\n                <\u002Fdiv>\n                <div data-leg=\"3\" style=\"display:flex;gap:11px;align-items:flex-start;background:#1A2436;border-radius:14px;padding:12px;opacity:.25\">\n                  <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#43BC7E;margin-top:5px\"><\u002Fspan>\n                  <span style=\"flex:1\"><b style=\"display:block;font-size:13.5px;font-weight:640\">Walk to the rental counter<\u002Fb><i data-legmeta=\"\" style=\"display:block;font-style:normal;font-size:11.5px;color:#9EA8BA;margin-top:2px\">3 min / checking…<\u002Fi><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"margin-top:auto;border-top:1px solid #24314A;padding-top:11px;font-size:11px;color:#9EA8BA;line-height:1.45\">Every leg carries the source it came from and the moment it was fetched.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:26px;display:flex;justify-content:center;align-items:flex-start\"><span style=\"width:120px;height:4px;border-radius:2px;background:#3A4762\"><\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg) translateZ(15px);border-radius:48px;overflow:hidden;background:transparent;box-shadow:0 40px 80px rgba(23,33,51,.3)\">\n            <div style=\"position:absolute;inset:-1px;background:#E9E6DF url(&quot;00a33496-d19a-43eb-8e6d-19885ead9462&quot;) center/100% 100% no-repeat\"><\u002Fdiv>\n            <div ref=\"{{ backSheenRef }}\" style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(104deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.10) 47%,rgba(255,255,255,0) 56%)\"><\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"problem\" style=\"border-top:1px solid #E4DFD0;padding:clamp(46px,7vw,82px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <p data-reveal=\"\" style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 14px\">The problem<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-size:clamp(26px,3.8vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0;max-width:22ch;text-wrap:pretty\">Maps route across a graph. Some edges were never in it.<\u002Fh2>\n    <div data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:16.5px\">\n      <p style=\"margin:16px 0 0\">Mapping apps are excellent at what they have data for. They route across digitized road and transit graphs, and anything missing from that graph is simply invisible to them. Private shuttles, terminal interiors, courtesy vans, informal connections: the edges do not exist, so the answer that comes back is technically valid and practically useless.<\u002Fp>\n      <p style=\"margin:16px 0 0\"><strong style=\"color:#172133;font-weight:640\">The anchor case, and the one Laneway is tested against:<\u002Fstrong> you land at Toronto Pearson Terminal 1 and need an off-airport rental depot. The shuttle that serves it is in no transit feed, and the walk between terminals is not a mapped footway, so nothing in any graph connects the two.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:20px;margin-top:38px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start\">\n      <div data-reveal=\"\" style=\"background:#FFF;border:1px solid #E4DFD0;border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(23,33,51,.07)\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:18px\">\n          <span style=\"font-weight:650;font-size:15px\">Every mapping app<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:12px;color:#6B7587\">One leg, no connections<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:62px;margin:6px\">\n          <span style=\"position:absolute;top:50%;left:2px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#A9A296\"><\u002Fspan>\n          <span style=\"position:absolute;left:8px;right:8px;top:50%;height:0;border-top:2px dashed #A9A296\"><\u002Fspan>\n          <span style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#FFF;padding:0 10px;color:#A9A296;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"4\" r=\"2\" fill=\"currentColor\"><\u002Fcircle><path d=\"M11 21l2-6-3-3 1-4 3 3 3 1M10 12l-2 3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg> 2 h 4 min walk<\u002Fspan>\n          <span style=\"position:absolute;top:50%;right:2px;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#A9A296\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin-top:14px;font-size:14px;color:#6B7587;border-left:2px solid #E4DFD0;padding-left:12px\">A two hour walk along an airport perimeter road, or a driving route to a car rental depot you have no car to reach.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;border:1px solid #E4DFD0;border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(23,33,51,.07)\">\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:18px\">\n          <span style=\"font-weight:650;font-size:15px\">Laneway<\u002Fspan>\n          <span style=\"margin-left:auto;font-size:12px;color:#6B7587\">Four legs, each sourced<\u002Fspan>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px\">\n          <li style=\"display:flex;gap:14px\">\n            <div style=\"flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#172133;color:#FBF9F2\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"4\" r=\"2\" fill=\"currentColor\"><\u002Fcircle><path d=\"M11 21l2-6-3-3 1-4 3 3 3 1M10 12l-2 3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:640;line-height:1.35\">Walk to the LINK platform, level 3<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6B7587;margin-top:3px\">6 min, inside the terminal<\u002Fdiv>\n              <span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-top:8px;background:color-mix(in srgb,#299E63 15%,transparent);color:#299E63\">Verified<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:flex;gap:14px\">\n            <div style=\"flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#E89E2E;color:#1F1705\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"5\" y=\"3\" width=\"14\" height=\"14\" rx=\"3\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><path d=\"M5 11h14M8 21l2-3M16 21l-2-3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:640;line-height:1.35\">LINK train to Terminal 3<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6B7587;margin-top:3px\">4 min, runs continuously<\u002Fdiv>\n              <span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-top:8px;background:color-mix(in srgb,#299E63 15%,transparent);color:#299E63\">Verified<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:flex;gap:14px\">\n            <div style=\"flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#E89E2E;color:#1F1705\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"10\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"2\"><\u002Frect><path d=\"M3 12h18M7 20v-4M17 20v-4\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:640;line-height:1.35\">Operator shuttle from the arrivals post<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6B7587;margin-top:3px\">Roughly every 20 min, no published timetable<\u002Fdiv>\n              <span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-top:8px;background:color-mix(in srgb,#B4761A 17%,transparent);color:#B4761A\">Unverified, call ahead<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n          <li style=\"display:flex;gap:14px\">\n            <div style=\"flex:none;width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#172133;color:#FBF9F2\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"13\" cy=\"4\" r=\"2\" fill=\"currentColor\"><\u002Fcircle><path d=\"M11 21l2-6-3-3 1-4 3 3 3 1M10 12l-2 3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div>\n              <div style=\"font-size:15px;font-weight:640;line-height:1.35\">Walk to the rental counter<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6B7587;margin-top:3px\">3 min<\u002Fdiv>\n              <span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-top:8px;background:color-mix(in srgb,#299E63 15%,transparent);color:#299E63\">Verified<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:15px;margin-top:26px\">The third leg is the point. Laneway does not know its timetable, so it does not invent one. It says so, and it still gives you the leg, because \"roughly every 20 minutes, call ahead\" is a usable answer and a two hour walk is not.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"proof\" style=\"border-top:1px solid #E4DFD0;padding:clamp(46px,7vw,82px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <p data-reveal=\"\" style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 14px\">The one rule<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-size:clamp(26px,3.8vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0;max-width:22ch;text-wrap:pretty\">Never present a fact the system cannot back up.<\u002Fh2>\n    <div data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:16.5px\">\n      <p style=\"margin:16px 0 0\">Any competent model can produce a plausible airport itinerary. The reason nobody trusts that output is that plausible and correct look identical on the page. One fabricated shuttle stop destroys trust permanently.<\u002Fp>\n      <p style=\"margin:16px 0 0\">So every claim in a Laneway plan is checked against a retrieved source before you see it, and the checker is allowed to say no. Three verdicts, never collapsed into two. These are real results from the engine:<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:16px;margin-top:36px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))\">\n      <div data-reveal=\"\" style=\"background:#FFF;border:1px solid #E4DFD0;border-radius:20px;padding:20px;display:flex;flex-direction:column;box-shadow:0 12px 34px rgba(23,33,51,.07)\">\n        <div><span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,#299E63 15%,transparent);color:#299E63\">Supported<\u002Fspan><\u002Fdiv>\n        <blockquote style=\"margin:16px 0;font-size:16px;line-height:1.45;font-weight:560\">\"MiWay route 7 serves stops on Airport Road.\"<\u002Fblockquote>\n        <div style=\"margin-top:auto;padding-top:14px;font-size:12.5px;color:#6B7587;border-top:1px solid #E4DFD0\">\n          <span style=\"display:block\">Checked against<\u002Fspan>\n          <span style=\"display:block;color:#172133;word-break:break-word\">MiWay official GTFS schedule feed<\u002Fspan>\n          <span style=\"display:block\">The feed lists a stop at 6445 Airport Rd<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;border:1px solid #E4DFD0;border-radius:20px;padding:20px;display:flex;flex-direction:column;box-shadow:0 12px 34px rgba(23,33,51,.07)\">\n        <div><span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,#D14238 15%,transparent);color:#D14238\">Contradicted<\u002Fspan><\u002Fdiv>\n        <blockquote style=\"margin:16px 0;font-size:16px;line-height:1.45;font-weight:560\">\"MiWay route 7 enters Pearson Terminal 1.\"<\u002Fblockquote>\n        <div style=\"margin-top:auto;padding-top:14px;font-size:12.5px;color:#6B7587;border-top:1px solid #E4DFD0\">\n          <span style=\"display:block\">Checked against<\u002Fspan>\n          <span style=\"display:block;color:#172133;word-break:break-word\">MiWay official GTFS schedule feed<\u002Fspan>\n          <span style=\"display:block\">Route termini are City Centre and Westwood Square. The claim was dropped.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;border:1px solid #E4DFD0;border-radius:20px;padding:20px;display:flex;flex-direction:column;box-shadow:0 12px 34px rgba(23,33,51,.07)\">\n        <div><span style=\"display:inline-flex;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,#B4761A 17%,transparent);color:#B4761A\">Unsupported<\u002Fspan><\u002Fdiv>\n        <blockquote style=\"margin:16px 0;font-size:16px;line-height:1.45;font-weight:560\">\"The rental shuttle leaves from the arrivals level post.\"<\u002Fblockquote>\n        <div style=\"margin-top:auto;padding-top:14px;font-size:12.5px;color:#6B7587;border-top:1px solid #E4DFD0\">\n          <span style=\"display:block\">Checked against<\u002Fspan>\n          <span style=\"display:block;color:#172133;word-break:break-word\">Operator website, unreachable<\u002Fspan>\n          <span style=\"display:block\">Shown to you as unverified, never quietly deleted and never stated as fact.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:16.5px;margin-top:28px\">A fact without provenance is a bug, not a feature, so the type system refuses to build one: inside the engine an unsourced fact is literally unconstructible. Every source carries the URL it came from and the moment it was fetched.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"border-top:1px solid #E4DFD0;padding:clamp(46px,7vw,82px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <p data-reveal=\"\" style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 14px\">How it works<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-size:clamp(26px,3.8vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0;max-width:22ch;text-wrap:pretty\">A slow layer that thinks, a fast layer that checks.<\u002Fh2>\n    <p data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:16.5px;margin:16px 0 0\">The model proposes. It never gets the last word. Retrieval, caching and composition are deterministic with no model calls inside them, which is what keeps both the cost and the failure modes predictable.<\u002Fp>\n    <div style=\"display:grid;gap:1px;margin-top:36px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid #E4DFD0;border-radius:20px;overflow:hidden;background:#E4DFD0\">\n      <div data-reveal=\"\" style=\"background:#FFF;padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">01<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Intake<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Plain language becomes a structured trip query. When it is ambiguous it asks rather than guesses.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">02<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Planner<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Decides which legs to attempt and what evidence each one needs. Treated as untrusted throughout.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">03<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Retrieval<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Official feeds first, then the open web. Cache-first, robots respected, crawler identified honestly.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">04<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Composer<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Chains legs into a journey and checks the timing is actually possible. Deterministic.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:color-mix(in srgb,#E89E2E 10%,#FFF);padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">05<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Verifier<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Every claim traced to a verbatim span in a real source, or marked unverified. Fails closed.<\u002Fp><\u002Fdiv>\n      <div data-reveal=\"\" style=\"background:#FFF;padding:18px 16px 20px\"><span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;color:#B4761A;font-weight:700\">06<\u002Fspan><h4 style=\"margin:8px 0 5px;font-size:15px;font-weight:650\">Present<\u002Fh4><p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#6B7587\">Map, timeline, turn-by-turn, and a citation on every leg. Saved plans work with no signal.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"\" style=\"color:#6B7587;max-width:62ch;font-size:16.5px;margin-top:28px\">Popular routes warm a shared cache, so the hundredth person asking about Pearson to a rental depot gets an answer that is already verified. That is the difference between scraping as pure cost and scraping as a dataset that usage pays for.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"status\" style=\"border-top:1px solid #E4DFD0;padding:clamp(46px,7vw,82px) 0\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n    <p data-reveal=\"\" style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#B4761A;margin:0 0 14px\">Where it actually is<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-size:clamp(26px,3.8vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0;max-width:22ch;text-wrap:pretty\">Honest status, since that is the whole product.<\u002Fh2>\n    <div style=\"display:grid;gap:26px;margin-top:36px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n      <div data-reveal=\"\">\n        <h3 style=\"font-size:18px;margin:0 0 8px;font-weight:650\">Working today<\u002Fh3>\n        <ul style=\"list-style:none;margin:14px 0 0;padding:0\">\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#299E63\" stroke-width=\"2\"><\u002Fcircle><path d=\"M8 12.4l2.6 2.6L16 9.6\" stroke=\"#299E63\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Verified multi-modal plans<\u002Fb> with a source and a fetch time on every claim<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#299E63\" stroke-width=\"2\"><\u002Fcircle><path d=\"M8 12.4l2.6 2.6L16 9.6\" stroke=\"#299E63\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Turn-by-turn navigation<\u002Fb> with off-route detection and a lock screen Live Activity<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#299E63\" stroke-width=\"2\"><\u002Fcircle><path d=\"M8 12.4l2.6 2.6L16 9.6\" stroke=\"#299E63\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Live vehicle positions<\u002Fb> where the operator publishes a realtime feed<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#299E63\" stroke-width=\"2\"><\u002Fcircle><path d=\"M8 12.4l2.6 2.6L16 9.6\" stroke=\"#299E63\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Walking routes on real footpaths<\u002Fb> from OpenStreetMap, not around the block<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#299E63\" stroke-width=\"2\"><\u002Fcircle><path d=\"M8 12.4l2.6 2.6L16 9.6\" stroke=\"#299E63\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Saved plans that open offline<\u002Fb>, because airport wifi fails exactly when you need the plan<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div data-reveal=\"\">\n        <h3 style=\"font-size:18px;margin:0 0 8px;font-weight:650\">Not there yet<\u002Fh3>\n        <ul style=\"list-style:none;margin:14px 0 0;padding:0\">\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".45\"><\u002Fcircle><path d=\"M8.5 12h7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" opacity=\".45\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">No public release.<\u002Fb> There is nothing to download yet, and no App Store listing.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".45\"><\u002Fcircle><path d=\"M8.5 12h7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" opacity=\".45\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">iOS only<\u002Fb>, and Canada only, on purpose. Coverage grows one transit feed at a time.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #E4DFD0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".45\"><\u002Fcircle><path d=\"M8.5 12h7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" opacity=\".45\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">No voice guidance<\u002Fb> yet, and no booking or payment for any individual leg.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:11px;padding:9px 0;font-size:15px;line-height:1.45\"><span style=\"flex:none;margin-top:3px\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"currentColor\" stroke-width=\"2\" opacity=\".45\"><\u002Fcircle><path d=\"M8.5 12h7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" opacity=\".45\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"color:#6B7587\"><b style=\"color:#172133;font-weight:640\">Some sources block crawlers.<\u002Fb> When that happens the leg comes back honestly unverified.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <p style=\"color:#6B7587;font-size:14.5px;margin-top:18px\">The engineering log is public and updated as the work happens. <a href=\"devlog.html\">Read the dev log<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px)\">\n  <div data-reveal=\"\" style=\"background:#172133;color:#F7F5ED;border-radius:20px;padding:clamp(28px,4.6vw,50px);margin-bottom:clamp(46px,7vw,78px)\">\n    <p style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#E89E2E;margin:0 0 14px\">What it is becoming<\u002Fp>\n    <h2 style=\"font-size:clamp(26px,3.8vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:700;margin:0;max-width:24ch;text-wrap:pretty\">An alternative to Apple and Google Maps whose routes are verified.<\u002Fh2>\n    <p style=\"color:color-mix(in srgb,#F7F5ED 74%,transparent);max-width:56ch;font-size:16.5px\">Planning and verification are the foundation and the moat. Navigation is the surface you live in. The goal is a maps app you can trust on the leg that matters, the one nothing else will route for you.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:32px\">\n      <a href=\"devlog.html\" style=\"display:inline-flex;align-items:center;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:650;background:#E89E2E;color:#1F1705\">Follow the build<\u002Fa>\n      <a href=\"https://github.com/barongartner\" style=\"display:inline-flex;align-items:center;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:650;background:transparent;border:1px solid color-mix(in srgb,#F7F5ED 34%,transparent);color:#F7F5ED\">GitHub<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #E4DFD0;padding:28px 0 42px;color:#6B7587;font-size:14px\">\n  <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(20px,4vw,40px);display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n    <span>Laneway. Built in the open, shipped when it is trustworthy.<\u002Fspan>\n    <span style=\"margin-left:auto;display:flex;gap:18px\"><a href=\"devlog.html\" style=\"color:#6B7587\">Dev log<\u002Fa><a href=\"https://github.com/barongartner\" style=\"color:#6B7587\">GitHub<\u002Fa><\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;spinTurns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll animation&quot;},&quot;stageLength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3.6,&quot;min&quot;:2,&quot;max&quot;:6,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;×100vh&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scroll animation&quot;},&quot;showCallouts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Scroll animation&quot;}}\">\nconst clamp = (v, a, b) => Math.min(b, Math.max(a, v));\nconst seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);\nconst mix = (a, b, t) => a + (b - a) * t;\nconst easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\n\nconst LEG_META = ['6 min / verified', '4 min / verified', 'Roughly every 20 min. Unverified, call ahead.', '3 min / verified'];\n\nclass Component extends DCLogic {\n  stageRef = React.createRef();\n  glowRef = React.createRef();\n  phoneRef = React.createRef();\n  rotRef = React.createRef();\n  backSheenRef = React.createRef();\n  glareRef = React.createRef();\n  barRef = React.createRef();\n\n  componentDidMount() {\n    const stage = this.stageRef.current;\n    if (!stage) return;\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    stage.style.height = (this.props.stageLength ?? 3.6) * 100 + 'vh';\n    this.legs = [...stage.querySelectorAll('[data-leg]')];\n    this.legMetas = [...stage.querySelectorAll('[data-legmeta]')];\n    this.cues = [...stage.querySelectorAll('[data-cue]')];\n    this.labels = [...stage.querySelectorAll('[data-label]')];\n    this.onScroll = () => { this.pending = true; };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onScroll);\n    const tick = () => {\n      if (this.pending) { this.pending = false; this.update(); }\n      this.frame = requestAnimationFrame(tick);\n    };\n    this.pending = true;\n    this.frame = requestAnimationFrame(tick);\n    this.setupReveal();\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.frame);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onScroll);\n    if (this.io) this.io.disconnect();\n  }\n\n  setupReveal() {\n    this.fades = [];\n    document.querySelectorAll('section > div > p, section > div > h2, section > div > h3, blockquote, section h4').forEach(el => {\n      el.removeAttribute('data-reveal');\n      el.style.willChange = 'opacity, transform';\n      this.fades.push(el);\n    });\n    const nodes = [...document.querySelectorAll('[data-reveal]')];\n    if (this.reduced || !('IntersectionObserver' in window)) return;\n    nodes.forEach(n => {\n      n.style.opacity = '0';\n      n.style.transform = 'translateY(22px)';\n      n.style.transition = 'opacity .7s cubic-bezier(.22,.9,.25,1), transform .7s cubic-bezier(.22,.9,.25,1)';\n    });\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        e.target.style.opacity = '1';\n        e.target.style.transform = 'none';\n        this.io.unobserve(e.target);\n      });\n    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.08 });\n    nodes.forEach((n, i) => {\n      n.style.transitionDelay = (i % 4) * 70 + 'ms';\n      this.io.observe(n);\n    });\n  }\n\n  update() {\n    const stage = this.stageRef.current;\n    if (!stage) return;\n\n    const doc = document.documentElement;\n    if (this.barRef.current) {\n      const max = doc.scrollHeight - window.innerHeight;\n      this.barRef.current.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + '%';\n    }\n\n    const r = stage.getBoundingClientRect();\n    const total = Math.max(1, r.height - window.innerHeight);\n    const p = this.reduced ? 0.85 : clamp(-r.top / total, 0, 1);\n\n    const emerge = easeOut(seg(p, 0.02, 0.30));\n    const spinT = easeInOut(seg(p, 0.34, 0.62));\n    const settle = seg(p, 0.62, 0.72);\n    const verify = seg(p, 0.68, 0.90);\n    const turns = this.props.spinTurns ?? 1;\n\n    const fit = Math.min(1, (window.innerHeight * 0.6) / 720, (window.innerWidth * 0.92) / 420);\n    const scale = mix(0.7, 1, emerge) * fit;\n    let cueBottom = 153;\n    if (this.cues[0]) {\n      const cr = this.cues[0].getBoundingClientRect();\n      if (cr.height) cueBottom = cr.top + cr.height;\n    }\n    const settledY = Math.max(0, (cueBottom + 24) - (window.innerHeight / 2 - 340 * scale));\n    const startY = window.innerHeight * 0.5 + 340 * scale + 48;\n    const y = mix(startY, settledY, emerge);\n    const rotY = spinT * 360 * turns;\n    const rotX = mix(14, 0, emerge) + Math.sin(spinT * Math.PI) * 5;\n    const rotZ = mix(-3, 0, emerge);\n\n    const ph = this.phoneRef.current, rt = this.rotRef.current;\n    if (ph && rt) {\n      ph.style.transform = 'translate3d(0,' + y.toFixed(2) + 'px,0) scale(' + scale.toFixed(3) + ')';\n      ph.style.transformOrigin = '50% 50%';\n      ph.style.opacity = seg(p, 0.01, 0.07).toFixed(3);\n      rt.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg) rotateZ(' + rotZ.toFixed(2) + 'deg)';\n    }\n\n    const rad = rotY * Math.PI / 180;\n    const facing = Math.abs(Math.cos(rad));\n    if (this.backSheenRef.current) {\n      const sweep = 50 - 46 * Math.sin(rad);\n      this.backSheenRef.current.style.background =\n        'linear-gradient(' + (100 + rotX * 0.8).toFixed(1) + 'deg,rgba(255,255,255,0) ' + (sweep - 22).toFixed(1) + '%,rgba(255,255,255,' + (0.05 + 0.22 * facing).toFixed(3) + ') ' + sweep.toFixed(1) + '%,rgba(255,255,255,0) ' + (sweep + 22).toFixed(1) + '%)';\n    }\n    if (this.glareRef.current) {\n      const s2 = 50 + 52 * Math.sin(rad + 0.7);\n      this.glareRef.current.style.background =\n        'linear-gradient(' + (112 - rotX * 0.8).toFixed(1) + 'deg,rgba(255,255,255,0) ' + (s2 - 20).toFixed(1) + '%,rgba(255,255,255,' + (0.04 + 0.12 * facing).toFixed(3) + ') ' + s2.toFixed(1) + '%,rgba(255,255,255,0) ' + (s2 + 20).toFixed(1) + '%)';\n    }\n\n    this.glowRef.current.style.opacity = (Math.min(emerge, 1) * 0.55 + settle * 0.35).toFixed(3);\n    this.glowRef.current.style.transform = 'scale(' + (0.6 + emerge * 0.5).toFixed(3) + ')';\n\n    const cueOn = [seg(p, 0.04, 0.14) - seg(p, 0.28, 0.36), seg(p, 0.38, 0.46) - seg(p, 0.58, 0.66), seg(p, 0.68, 0.76)];\n    this.cues.forEach((el, i) => {\n      const o = clamp(cueOn[i], 0, 1);\n      el.style.opacity = o.toFixed(3);\n      el.style.transform = 'translateY(' + ((1 - o) * 16).toFixed(1) + 'px)';\n    });\n\n    const showLabels = (this.props.showCallouts ?? true) && window.innerWidth > 1040;\n    this.labels.forEach((el, i) => {\n      const o = showLabels ? clamp(seg(p, 0.72 + i * 0.05, 0.80 + i * 0.05), 0, 1) : 0;\n      el.style.opacity = o.toFixed(3);\n      el.style.transform = 'translateX(' + ((1 - o) * (i === 0 ? -26 : 26)).toFixed(1) + 'px)';\n    });\n\n    if (this.fades && !this.reduced) {\n      const vh = window.innerHeight;\n      this.fades.forEach(el => {\n        const b = el.getBoundingClientRect();\n        if (b.bottom < -80 || b.top > vh + 80) { if (el.style.opacity !== '0') el.style.opacity = '0'; return; }\n        const inT = clamp((vh - b.top) / (vh * 0.30), 0, 1);\n        const outT = clamp((b.bottom + 40) / (vh * 0.26), 0, 1);\n        const o = easeOut(inT) * easeOut(outT);\n        el.style.opacity = o.toFixed(3);\n        el.style.transform = 'translate3d(0,' + ((1 - easeOut(inT)) * 26 - (1 - easeOut(outT)) * 14).toFixed(1) + 'px,0)';\n      });\n    }\n\n    this.legs.forEach((el, i) => {\n      const t = clamp(verify * 4 - i, 0, 1);\n      el.style.opacity = (0.25 + t * 0.75).toFixed(3);\n      el.style.transform = 'translateX(' + ((1 - t) * 12).toFixed(1) + 'px)';\n      const meta = this.legMetas[i];\n      const done = t > 0.55;\n      if (meta && meta.dataset.done !== String(done)) {\n        meta.dataset.done = String(done);\n        meta.textContent = done ? LEG_META[i] : (i === 2 ? 'Checking…' : LEG_META[i].split(' / ')[0] + ' / checking…');\n      }\n    });\n\n  }\n\n  renderVals() {\n    return {\n      stageRef: this.stageRef,\n      glowRef: this.glowRef,\n      phoneRef: this.phoneRef,\n      rotRef: this.rotRef,\n      backSheenRef: this.backSheenRef,\n      glareRef: this.glareRef,\n      barRef: this.barRef\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
