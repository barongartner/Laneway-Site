name: Render dev log

# devlog.md is the source of truth. When it changes on main, regenerate
# devlog.html and commit the result, so the published page always matches
# the markdown without anyone running a script by hand.
on:
  push:
    branches: [main]
    paths:
      - devlog.md
      - tools/build_devlog.py
      - .github/workflows/devlog.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-devlog
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render devlog.md into devlog.html
        run: python3 tools/build_devlog.py

      - name: ASCII only, the house rule
        run: |
          python3 -c "
          import io, sys, glob
          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          ALLOW = {chr(0xa7)}
          bad = False
          for path in glob.glob('**/*.*', recursive=True):
              if '/.git/' in path: continue
              for i, line in enumerate(io.open(path, encoding='utf-8'), 1):
                  if any(ord(c) > 127 and c not in ALLOW for c in line):
                      print(path, i, line.rstrip()); bad = True
          print('FOUND NON-ASCII' if bad else 'clean')
          sys.exit(1 if bad else 0)
          "

      - name: Commit the rendered page
        run: |
          if git diff --quiet -- devlog.html; then
            echo "devlog.html already matches devlog.md, nothing to commit"
            exit 0
          fi
          git config user.name "Baron Gartner"
          git config user.email "barongartner@gmail.com"
          git add devlog.html
          git commit -m "Render devlog.html from devlog.md

          Generated by tools/build_devlog.py in CI. Edit devlog.md, not this file.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
